  </text>

  <g font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="600">
    <rect x="80" y="390" width="150" height="46" rx="23" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="155" y="419" text-anchor="middle" fill="#374151">备考学习</text>

    <rect x="246" y="390" width="120" height="46" rx="23" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="306" y="419" text-anchor="middle" fill="#374151">健身睡眠</text>

    <rect x="382" y="390" width="120" height="46" rx="23" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="442" y="419" text-anchor="middle" fill="#374151">求职工作</text>

    <rect x="518" y="390" width="120" height="46" rx="23" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="578" y="419" text-anchor="middle" fill="#374151">情绪支持</text>

    <rect x="654" y="390" width="120" height="46" rx="23" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="714" y="419" text-anchor="middle" fill="#374151">财务记账</text>

    <rect x="790" y="390" width="120" height="46" rx="23" fill="#ffffff" stroke="#e5e7eb"/>
