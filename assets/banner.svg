  <rect x="80" y="540" width="1040" height="4" rx="2" fill="url(#brand)" opacity="0.85"/>

  <text x="82" y="590" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#9ca3af">
