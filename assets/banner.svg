<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="json-prompt-form">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="0.55" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#fdf2f8"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="110" r="150" fill="#e0e7ff" opacity="0.7"/>
  <circle cx="120" cy="540" r="120" fill="#fce7f3" opacity="0.7"/>

  <text x="80" y="210" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="76" font-weight="800" fill="#1f2330">
