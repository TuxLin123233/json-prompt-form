<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f4f4">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>存档检查器 · 一事一练</title>
<meta name="description" content="粘贴 AI 输出的存档 JSON，检查格式、字段、截断和功能状态。">
<style>
  :root {
    --paper: #f4f4f4; --paper-deep: #ebebeb; --card: #ffffff;
    --ink: #111111; --ink-soft: #2c2c2c; --muted: #6e6e6e;
    --line: #dedede; --line-strong: #bdbdbd; --black: #0a0a0a;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-display: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", Georgia, serif;
    --font-mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--font-sans); line-height: 1.65;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  ::selection { background: var(--ink); color: var(--paper); }
  a { color: inherit; text-underline-offset: 3px; }
  button, input, textarea { font: inherit; color: inherit; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 24px 72px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    flex-wrap: wrap; min-height: 64px; border-bottom: 1px solid var(--line);
  }
  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
  .brand-mark {
    width: 32px; height: 32px; display: grid; place-items: center;
    background: var(--ink); color: var(--paper);
    font-family: var(--font-mono); font-size: 13px; letter-spacing: -1px;
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.1; font-size: 14px; font-weight: 700; }
  .brand-text small {
    margin-top: 3px; font-size: 9px; font-weight: 500; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted);
  }
  .topnav { display: flex; gap: 18px; font-size: 12px; color: var(--muted); }
  .topnav a { text-decoration: none; }
  .topnav a:hover { color: var(--ink); }
  header.hero { padding: clamp(40px, 7vw, 64px) 0 clamp(28px, 4vw, 40px); }
  .eyebrow {
    margin: 0 0 12px; font-family: var(--font-mono); font-size: 11px;
    letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
  }
  .hero h1 {
    margin: 0 0 14px; font-family: var(--font-display); font-weight: 600;
    font-size: clamp(2rem, 5vw, 3rem); line-height: 1.12; letter-spacing: -.02em;
  }
  .hero p { margin: 0; max-width: 46em; color: var(--muted); font-size: 15px; }
  h2 { margin: 40px 0 14px; font-size: 17px; line-height: 1.3; letter-spacing: .01em; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 2px; padding: 22px; }
  label {
    display: block; margin: 20px 0 8px; font-family: var(--font-mono);
    font-size: 11px; font-weight: 500; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
  }
  label:first-child { margin-top: 0; }
  input[type=text], input[type=number], textarea {
    width: 100%; border: 1px solid var(--line-strong); border-radius: 2px;
    padding: 11px 13px; font-size: 15px; background: var(--card); color: var(--ink);
  }
  textarea { min-height: 84px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: var(--ink); }
  .hint { color: var(--muted); font-size: 13px; margin-top: 10px; }
  .row { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
  .checks { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin-top: 6px; }
  .check {
    display: flex; align-items: center; gap: 8px; background: var(--paper);
    border: 1px solid var(--line); border-radius: 2px; padding: 10px 12px;
    font-size: 14px; cursor: pointer;
  }
  .check input { width: 15px; height: 15px; accent-color: var(--ink); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; }
  .btn {
    appearance: none; display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--ink); border-radius: 2px; background: transparent; color: var(--ink);
    padding: 11px 18px; font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer;
    transition: background .2s, color .2s, border-color .2s;
  }
  .btn:hover { background: var(--ink); color: var(--paper); }
  .btn.primary { background: var(--ink); color: var(--paper); }
  .btn.primary:hover { background: var(--black); }
  .btn:disabled { opacity: .45; cursor: wait; }
  .status { margin-top: 16px; font-size: 14px; color: var(--muted); }
  .status.error {
    color: var(--ink); background: var(--paper-deep);
    border-left: 2px solid var(--ink); padding: 8px 12px;
  }
  .status.ok { color: var(--ink); font-weight: 600; }
  pre.code {
    margin: 14px 0 0; padding: 16px; border-radius: 2px;
    background: var(--black); color: #e8e8e8; overflow: auto;
    font-family: var(--font-mono); font-size: 12px; line-height: 1.55;
    max-height: 480px; white-space: pre;
  }
  .result { display: none; margin-top: 8px; }
  footer {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    flex-wrap: wrap; margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--line);
    font-family: var(--font-mono); font-size: 11px; color: var(--muted);
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--ink); }
  .summary { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 8px; }
  .pill {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em;
    padding: 4px 10px; border: 1px solid var(--line-strong); border-radius: 2px;
    background: var(--card); color: var(--ink);
  }
  .pill.ok { border-color: var(--ink); }
  .pill.err { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .pill.warn { border-style: dashed; }
  ul.report { list-style: none; margin: 10px 0 0; padding: 0; }
  ul.report li {
    margin-bottom: 6px; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 2px; background: var(--card); font-size: 14px;
  }
  ul.report li.ok { color: var(--muted); }
  ul.report li.err { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  ul.report li.warn { border-style: dashed; border-color: var(--line-strong); }
  ul.report li.info { background: var(--paper); }
  textarea { min-height: 300px; font-family: var(--font-mono); font-size: 13px; line-height: 1.55; }
  @media (min-width: 1200px) {
    .wrap { max-width: 1120px; padding: 0 32px 88px; }
    .topbar { min-height: 72px; }
    .brand-mark { width: 36px; height: 36px; font-size: 14px; }
    header.hero { padding: clamp(56px, 6vw, 84px) 0 clamp(32px, 4vw, 48px); }
    .hero h1 { font-size: clamp(2.6rem, 3.4vw, 3.4rem); }
    .panel { padding: 26px; }
    textarea { min-height: 380px; font-size: 14px; }
  }
  @media (max-width: 640px) { textarea { min-height: 240px; font-size: 12px; } }
  @media (max-width: 640px) {
    .wrap { padding: 0 16px 56px; }
    .brand-text small { display: none; }
    .topnav { gap: 14px; font-size: 11px; }
    .row { grid-template-columns: 1fr; }
    .btn { min-height: 46px; }
    pre.code { font-size: 11px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="回到首页">
      <span class="brand-mark" aria-hidden="true">一</span>
      <span class="brand-text">一事一练<small>AI 长期陪练</small></span>
    </a>
    <nav class="topnav" aria-label="页面导航">
      <a href="index.html">首页</a>
      <a href="builder.html">自定义生成器</a>
      <a href="https://github.com/TuxLin123233/json-prompt-form" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </header>

  <header class="hero">
    <p class="eyebrow">存档检查器</p>
    <h1>检查你的存档 JSON</h1>
    <p>把 AI 输出的存档整段粘贴进来，检查格式、字段是否完整、有没有被截断。全部在本地完成。</p>
  </header>

  <h2>粘贴存档</h2>
  <div class="panel">
    <textarea id="input" placeholder="把 ```json 代码块里的内容整段粘贴到这里…" spellcheck="false"></textarea>
    <div class="actions">
      <button class="btn primary" id="check">检查</button>
      <button class="btn" id="format">格式化</button>
      <button class="btn" id="copy">复制</button>
      <button class="btn" id="sample">载入示例</button>
      <button class="btn" id="clear">清空</button>
      <a class="btn" href="index.html">返回首页</a>
    </div>
    <div class="hint">不会上传任何内容，检查全部在本地浏览器完成。支持带 ```json 代码块外壳的文本。</div>
  </div>

  <h2>检查结果</h2>
  <div class="summary" id="summary"></div>
  <ul class="report" id="report"></ul>

  <footer>
    <span>© 2026 LinSifan · MIT License</span>
    <span><a href="https://github.com/TuxLin123233/json-prompt-form">TuxLin123233/json-prompt-form</a></span>
  </footer>
</div>

<script>
const input = document.getElementById("input");
const reportEl = document.getElementById("report");
const summaryEl = document.getElementById("summary");
const REQUIRED = ["schema_version", "goal", "session_context", "assistant_identity", "scene", "functions", "memory", "output_rules"];
const FN_REQUIRED = ["id", "name", "what", "why", "how", "trigger", "frequency", "status", "source"];
const DATE = /^\d{4}-\d{2}-\d{2}$/;
const ID = /^f_[a-z0-9_]+$/;
let currentVersion = null;

fetch("updates.json")
  .then(res => (res.ok ? res.json() : null))
  .then(data => {
    if (data && data.current) currentVersion = data.current;
  })
  .catch(() => {});

function versionParts(value) {
  return String(value).split(".").map(part => parseInt(part, 10) || 0);
}

function isOlder(a, b) {
  const pa = versionParts(a);
  const pb = versionParts(b);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) < (pb[i] || 0);
  }
  return false;
}

function esc(text) {
  return String(text).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function stripFence(text) {
  const t = text.trim();
  try {
    JSON.parse(t);
    return t;
  } catch (err) {}
  const m = t.match(/^```(?:json)?\s*([\s\S]*?)\s*```$/i);
  if (m) return m[1].trim();
  const first = t.indexOf("```");
  const brace = t.indexOf("{");
  if (first !== -1 && (brace === -1 || first < brace)) {
    const last = t.lastIndexOf("```");
    if (last > first) {
      let inner = t.slice(first + 3, last).trim().replace(/^json\s*/i, "").trim();
      return inner;
    }
  }
  return t;
}

function braceBalance(text) {
  let depth = 0, inString = false, escaped = false, min = 0;
  for (const ch of text) {
    if (inString) {
      if (escaped) escaped = false;
      else if (ch === "\\") escaped = true;
      else if (ch === '"') inString = false;
      continue;
    }
    if (ch === '"') { inString = true; continue; }
    if (ch === "{" || ch === "[") depth++;
    if (ch === "}" || ch === "]") { depth--; if (depth < min) min = depth; }
  }
  return { depth, min, inString };
}

function add(list, level, text) {
  list.push({ level, text });
}

function analyze(raw) {
  const list = [];
  const text = stripFence(raw || "");
  if (!text) {
    add(list, "err", "没有内容：请先粘贴存档 JSON。");
    return { list, summary: [] };
  }

  const size = new Blob([text]).size;
  let data = null;
  try {
    data = JSON.parse(text);
  } catch (err) {
    add(list, "err", "不是合法 JSON：" + err.message);
    const bal = braceBalance(text);
    if (bal.depth > 0) add(list, "warn", `括号没有闭合（还剩 ${bal.depth} 层），存档可能被截断了。回复 AI「继续」让它发完。`);
    if (bal.depth < 0) add(list, "warn", "有多余的右括号，可能粘贴了重复内容或代码块外壳。");
    if (bal.inString) add(list, "warn", "字符串没有闭合，通常说明内容被截断。");
    add(list, "info", "仍然不行时：让 AI「请输出完整存档 JSON」，或说「精简存档」减少体积。");
    return { list, summary: [{ cls: "err", text: "格式错误" }, { cls: "", text: (size / 1024).toFixed(1) + " KB" }] };
  }

  if (typeof data !== "object" || data === null || Array.isArray(data)) {
    add(list, "err", "顶层必须是 JSON 对象（以 { 开头），当前不是。");
    return { list, summary: [{ cls: "err", text: "结构错误" }] };
  }

  REQUIRED.forEach(key => {
    if (!(key in data)) add(list, "err", "缺少必填字段：" + key);
  });

  const version = data.schema_version;
  if (typeof version === "string" && /^\d+\.\d+\.\d+$/.test(version)) {
    add(list, "ok", "schema_version：" + version);
    if (currentVersion && isOlder(version, currentVersion)) {
      add(list, "warn", "这是旧版存档（当前 " + currentVersion + "）。把当前模板和存档一起贴给 AI，会按 compatibility.updates 自动升级；也可用 scripts/migrate.py 迁移。");
    }
  } else if (version === undefined) {
    add(list, "warn", "没有 schema_version，可能是旧存档。把当前模板和存档一起贴给 AI，或运行 scripts/migrate.py 迁移。");
  }

  const isCompact = !("usage" in data) && !("protocol" in data) && !("safety" in data);
  if (isCompact) {
    add(list, "warn", "这看起来是精简存档：续接时请同时贴入原始模板，让 AI 补回省略的规则。");
  }

  const ctx = data.session_context;
  if (ctx && typeof ctx === "object") {
    if ("today" in ctx && ctx.today !== null) {
      if (typeof ctx.today !== "string" || !DATE.test(ctx.today)) add(list, "err", "session_context.today 不是 YYYY-MM-DD：" + JSON.stringify(ctx.today));
      else add(list, "ok", "今天日期：" + ctx.today);
    } else {
      add(list, "warn", "session_context.today 为空：续接时记得告诉 AI 今天几号。");
    }
  }

  const functions = data.functions;
  let fnCount = 0, active = 0;
  if (Array.isArray(functions)) {
    fnCount = functions.length;
    if (fnCount === 0) add(list, "warn", "functions 是空数组：至少应有 1 个功能。");
    if (fnCount > 12) add(list, "warn", "功能超过 12 个，建议合并或停用一些。");
    const ids = new Set();
    functions.forEach((f, i) => {
      const label = "功能 #" + (i + 1) + (f && f.name ? "「" + f.name + "」" : "");
      if (!f || typeof f !== "object") { add(list, "err", label + " 不是对象。"); return; }
      FN_REQUIRED.forEach(k => { if (!(k in f)) add(list, "err", label + " 缺少字段：" + k); });
      if (f.id && !ID.test(f.id)) add(list, "err", label + " 的 id 不合规：" + f.id);
      if (f.id) {
        if (ids.has(f.id)) add(list, "err", "id 重复：" + f.id);
        ids.add(f.id);
      }
      if (f.status === "active") active++;
      if (f.status && !["active", "paused", "retired"].includes(f.status)) add(list, "err", label + " 的 status 无效：" + f.status);
      if (f.source && !["initial", "ai_suggest", "user_add", "user_modify"].includes(f.source)) add(list, "err", label + " 的 source 无效：" + f.source);
      ["last_triggered_at", "created_at", "updated_at"].forEach(k => {
        if (f[k] !== null && f[k] !== undefined && (typeof f[k] !== "string" || !DATE.test(f[k]))) add(list, "err", label + " 的 " + k + " 不是日期：" + JSON.stringify(f[k]));
      });
    });
    const allIds = new Set(functions.filter(f => f && f.id).map(f => f.id));
    functions.forEach(f => {
      if (f && Array.isArray(f.linked_with)) {
        f.linked_with.forEach(ref => { if (!allIds.has(ref)) add(list, "warn", "功能 " + f.id + " 的 linked_with 引用了不存在的 id：" + ref); });
      }
    });
  } else {
    add(list, "err", "functions 必须是数组。");
  }

  const state = data.memory && data.memory.state;
  if (!state || typeof state !== "object") {
    add(list, "err", "memory.state 缺失或不是对象。");
  } else {
    const sessions = state.recent_sessions;
    if (Array.isArray(sessions)) {
      sessions.forEach((s, i) => {
        if (s && typeof s.summary === "string" && s.summary.length > 120) add(list, "warn", "recent_sessions #" + (i + 1) + " 摘要超过 120 字，建议压缩。");
      });
    }
    add(list, "ok", "记忆摘要：" + (sessions && sessions.length ? sessions.length + " 条" : "暂无记录"));
  }

  if (data.output_rules && typeof data.output_rules === "object" && data.output_rules.on_session_end) {
    add(list, "ok", "输出规则已包含 on_session_end。");
  } else if (!isCompact) {
    add(list, "warn", "output_rules.on_session_end 缺失：AI 可能不知道收尾要输出存档。");
  }

  if (!list.some(x => x.level === "err")) add(list, "ok", "没有发现结构性错误。");

  const summary = [
    { cls: list.some(x => x.level === "err") ? "err" : "ok", text: list.some(x => x.level === "err") ? "有错误" : "基本通过" },
    { cls: "", text: (size / 1024).toFixed(1) + " KB" },
    { cls: "", text: "功能 " + fnCount + " 个 / 启用 " + active + " 个" },
    { cls: "", text: version ? "v" + version : "无版本号" },
    { cls: isCompact ? "warn" : "", text: isCompact ? "精简存档" : "完整存档" }
  ];
  return { list, summary };
}

function render(result) {
  summaryEl.innerHTML = result.summary.map(s => `<span class="pill ${s.cls}">${esc(s.text)}</span>`).join("");
  reportEl.innerHTML = result.list.map(x => `<li class="${x.level}">${esc(x.text)}</li>`).join("");
}

function run() {
  render(analyze(input.value));
}

document.getElementById("check").addEventListener("click", run);
document.getElementById("format").addEventListener("click", () => {
  try {
    input.value = JSON.stringify(JSON.parse(stripFence(input.value)), null, 4) + "\n";
    run();
  } catch (err) {
    render(analyze(input.value));
  }
});
document.getElementById("copy").addEventListener("click", async () => {
  try {
    if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(input.value);
    else {
      input.select();
      document.execCommand("copy");
    }
  } catch (err) {}
});
document.getElementById("clear").addEventListener("click", () => {
  input.value = "";
  summaryEl.innerHTML = "";
  reportEl.innerHTML = "";
});
document.getElementById("sample").addEventListener("click", async () => {
  try {
    const res = await fetch("examples/filled/study-exam.json", { cache: "no-cache" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    input.value = await res.text();
    run();
  } catch (err) {
    reportEl.innerHTML = '<li class="err">无法载入示例：请通过 GitHub Pages 打开。</li>';
  }
});

let timer = null;
input.addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(run, 500);
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
